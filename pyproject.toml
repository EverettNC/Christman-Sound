[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "christman-sound"
version = "1.0.0"
description = "Christman Sound — family audio, voice, and speech SDK"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Everett Nathaniel Christman", email = "lumacognify@thechristmanaiproject.com" },
]
dependencies = [
    "numpy<2",
    "librosa",
    "soundfile",
    # Intel Mac ceiling: PyTorch stopped publishing x86_64 macOS wheels after
    # 2.2.2 (see setup.py note). The marker keeps other platforms unpinned.
    "torch<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torch; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "torchaudio<2.3; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "torchaudio; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "transformers>=4.40,<5",
    "pygame",
    "pyttsx3",
    "flask",
    "fastapi",
    "rich",
    "praat-parselmouth",
]

[tool.setuptools.packages.find]
include = ["christman_voice_sdk*", "christman_sound*"]

[tool.setuptools.package-data]
christman_voice_sdk = ["py.typed"]
# The compiled DSP engine rides inside the package for wheel installs;
# editable installs find it at the repo root (core.py checks both homes).
christman_sound = ["*.so"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# -ra: every non-pass outcome is listed with its reason. A test that could
# not run is reported as NOT RUN (see tests/conftest.py), never as a bare "s".
addopts = "-ra"
